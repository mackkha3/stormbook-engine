# Realistic homeowner texts, one per entry, covering every intent.
#
#   text    what the homeowner sent
#   state   where the conversation is when it arrives:
#             fresh    GHL sent the first text; the engine has offered nothing yet
#             offered  the engine offered  1. Mon 10/5 at 11:00 AM   2. Tue 10/6 at 12:00 PM
#             asked    the engine asked "what day and time work best for you?"
#             booked   an inspection is booked for Mon 10/5 at 11:00 AM
#             cancelled  that inspection was booked, then cancelled by the homeowner
#   intent  the intent the model must return
#   slot_choice / preferred_date / preferred_time_window   details it must extract (if listed)
#   question_topic   for basic_question: who | area | other
#   acknowledgment_only: true   nothing but "ok" / "thanks"
#   live_not_opt_out: true   wording is ambiguous; live only checks it is NOT read as an opt-out
#   keyword: true    caught by the code opt-out rule before the model is asked (skipped live)
#   expect  the template the engine must answer with ("none" = send nothing)
#
# "Now" is Monday 2026-10-05 09:00 America/Chicago in every test.
# Used offline (scripted model → engine action) and live (`pytest -m live`: real model → intent).

# --- affirm ---------------------------------------------------------------
- {text: "yes", state: fresh, intent: affirm, expect: offer_slots}
- {text: "ya", state: fresh, intent: affirm, expect: offer_slots}
- {text: "yeah sure", state: fresh, intent: affirm, expect: offer_slots}
- {text: "pls", state: fresh, intent: affirm, expect: offer_slots}
- {text: "Yes please, that would be great", state: fresh, intent: affirm, expect: offer_slots}
- {text: "ok lets do it", state: fresh, intent: affirm, expect: offer_slots}
- {text: "ok thanks", state: booked, intent: affirm, expect: none}
- {text: "ok", state: cancelled, intent: affirm, acknowledgment_only: true, expect: none}
- {text: "thanks", state: cancelled, intent: affirm, acknowledgment_only: true, expect: none}
- {text: "actually yes lets get it back on the schedule", state: cancelled, intent: affirm, acknowledgment_only: false, expect: offer_slots}

