- {text: "2", state: offered, intent: pick_slot, slot_choice: 2, expect: booked}
- {text: "the second one", state: offered, intent: pick_slot, slot_choice: 2, expect: booked}
- {text: "tuesday works", state: offered, intent: pick_slot, slot_choice: 2, expect: booked}
- {text: "monday is good", state: offered, intent: pick_slot, slot_choice: 1, expect: booked}
- {text: "first one pls", state: offered, intent: pick_slot, slot_choice: 1, expect: booked}
- {text: "lets do the 11am", state: offered, intent: pick_slot, slot_choice: 1, expect: booked}

